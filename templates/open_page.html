<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Role | Placement Management System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wrapper {
            text-align: center;
            color: white;
        }

        .wrapper h1 {
            font-size: 38px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .wrapper p {
            font-size: 18px;
            margin-bottom: 50px;
            opacity: 0.9;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            color: #1e3c72;
            width: 270px;
            padding: 35px 25px;
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            background: #ffd700;
        }

        .icon {
            font-size: 45px;
            margin-bottom: 20px;
        }

        .card h2 {
            margin-bottom: 10px;
            font-weight: 600;
        }

        @media(max-width: 768px) {
            .cards {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <h1>Placement Management System</h1>
    <p>Select your role</p>

    <div class="cards">
        
        <a href="{% url 'student_register' %}" class="card">
            <div class="icon">🎓</div>
            <h2>Student</h2>
        </a>

        <!-- Company → Opens company_register.html -->
        <a href="{% url 'company_register' %}" class="card">
            <div class="icon">🏢</div>
            <h2>Company</h2>
        </a>

        <!-- Admin → Opens admin_register.html -->
        <a href="/admin/" class="card">
            <div class="icon">👤</div>
            <h2>Admin</h2>
        </a>
    </div>
</div>

</body>
</html>
